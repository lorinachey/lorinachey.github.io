- title: "Sim-to-Sim Transfer Framework"
  summary: >-
    A simulation-to-simulation transfer pipeline for validating control policies
    across physics engines, comparing IsaacSim with MuJoCo.
  # A self-hosted silent loop rather than a YouTube embed: 42 s, ~1 MB, cropped
  # to the two simulator viewports. The ProRes master it was cut from lives in
  # assets/video/masters/, which is gitignored and excluded from the build.
  clip:
