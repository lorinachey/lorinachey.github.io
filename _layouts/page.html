---
layout: default
---

<div class="page-content">
  {% if page.image %}
  <div class="featured-image">
    <img src="{{ site.github.url }}/assets/img/{{ page.image }}" alt="{{ page.image_alt | default: page.title }}">
  </div>
{% endif %}
  <h1>
    {{ page.title }}
  </h1>
  <article>
    {{ content }}
  </article>
</div>
