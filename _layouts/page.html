---
layout: default
---

<div class="page-content">
  {% if page.image %}
  <div class="featured-image">
    <img src="{{ page.image | prepend: '/assets/img/' | relative_url }}" alt="{{ page.image_alt | default: page.title }}">
  </div>
{% endif %}
  <h1>
    {{ page.title }}
  </h1>
  <article>
    {{ content }}
  </article>
</div>
