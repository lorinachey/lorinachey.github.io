---
layout: default
---

<div class="page-content cv">
  <div class="cv-head">
    <h1>{{ page.title }}</h1>
    {%- comment -%}
      The download button only appears once a PDF exists. Set `pdf:` in front
      matter when assets/pdf/ has one.
    {%- endcomment -%}
    {% if page.pdf %}
      <a class="btn btn--download" href="{{ page.pdf | relative_url }}" download>Download CV (PDF)</a>
    {% endif %}
  </div>
  <article class="cv-body">
    {{ content }}
  </article>
</div>
