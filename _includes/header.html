<header class="site-header">
  <div class="site-header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.data.settings.menu %}
        {%- assign href = item.url | prepend: '/' -%}
        <a href="{{ href | relative_url }}"
           class="nav-link{% if page.url == href %} is-current{% endif %}"
           {% if page.url == href %}aria-current="page"{% endif %}>{{ item.name }}</a>
      {% endfor %}
    </nav>
    {% include social-links.html class="social-links--header" %}
  </div>
</header>
